name: npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm 可信发布（OIDC）必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # 发布构建不要用 npm 缓存

      - name: 安装 pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          cache: true
          require-lockfile: true

      # 仅按 tag 触发时校验：tag 版本必须与 package.json 的 version 一致，
      # 防止把错误的（或已发布的）版本推上 npm。
      - name: 校验 tag 版本与 package.json 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "错误：tag 版本 v$tag 与 package.json 版本 $pkg 不一致" >&2
            exit 1
          fi

      - name: 编译 package
        run: pnpm run build

      # npm 可信发布（OIDC）要求 npm >= 11.5.1，Node 24 自带 npm 已满足，无需全局升级
      - name: 发布到 npmjs
        run: npm publish
